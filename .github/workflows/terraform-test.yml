name: Terraform Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Deploy Azure resources and run integration tests"
        required: true
        type: boolean
        default: false

env:
  TF_VERSION: "1.15.3"
  GO_VERSION: "1.26"
  GOFLAGS: "-mod=readonly"
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - modules/aks
          - examples/basic
          - examples/spark-cluster
          - envs/dev
          - envs/qa
          - envs/staging
          - envs/prod
          - test/fixtures/module
          - test/fixtures/integration
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform -chdir=${{ matrix.root }} init -backend=false -input=false -lockfile=readonly

      - name: Terraform Validate
        run: terraform -chdir=${{ matrix.root }} validate

  node-dependencies:
    name: Node Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify Node version
        run: test "$(node --version)" = "v$(cat .nvmrc)"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Audit Node dependencies
        run: npm audit --omit=dev

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: test/go.sum

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Download Go modules
        working-directory: ./test
        run: go mod download

      - name: Run Unit Tests
        working-directory: ./test
        run: go test -v -timeout 30m ./unit/...

      - name: Generate Coverage
        working-directory: ./test
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload Coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: terratest-coverage
          path: test/coverage.out

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: test/go.sum

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure Login
        uses: azure/login@v3.0.0
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      - name: Run Integration Tests
        working-directory: ./test
        env:
          RUN_INTEGRATION_TESTS: "true"
          TEST_LOCATION: "East US"
        run: go test -v -timeout 90m ./integration/...

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: true
          output_format: github_failed_only
          download_external_modules: true

  cost-estimation:
    name: Cost Estimation
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        if: env.INFRACOST_API_KEY != ''
        uses: actions/checkout@v6.0.2

      - name: Setup Infracost
        if: env.INFRACOST_API_KEY != ''
        uses: infracost/actions/setup@v4.1.0
        with:
          api-key: ${{ env.INFRACOST_API_KEY }}

      - name: Generate Infracost JSON
        if: env.INFRACOST_API_KEY != ''
        run: |
          infracost breakdown --path envs/prod \
            --format json \
            --out-file /tmp/infracost.json

      - name: Post Infracost comment
        if: env.INFRACOST_API_KEY != ''
        run: |
          infracost comment github --path=/tmp/infracost.json \
            --repo=$GITHUB_REPOSITORY \
            --pull-request=${{ github.event.pull_request.number }} \
            --github-token=${{ secrets.GITHUB_TOKEN }} \
            --behavior=update

  cleanup:
    name: Cleanup Test Resources
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.run_integration
    steps:
      - name: Azure Login
        uses: azure/login@v3.0.0
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      - name: Cleanup Test Resource Groups
        run: |
          az group list --query "[?tags.Purpose=='terratest' && tags.Temporary=='true'].name" -o tsv | while read -r rg; do
            echo "Deleting resource group: $rg"
            az group delete --name "$rg" --yes --no-wait || true
          done
